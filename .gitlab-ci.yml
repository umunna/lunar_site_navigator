# Automatic checks for both parts, and the public web page of the planner (GitLab Pages).
# The jobs need a runner with the Docker executor (the shared GitLab runners work).
#
#   planner-check                                   planner/     type check, code rules, tests, trace, build
#   rover-lint, rover-unit-tests,
#   rover-mesh-rebuild, rover-launch-files          rover-slam/  the checks of the rover simulation
#   pages                                           publishes the built planner (default branch only)

stages: [lint, test, deploy]

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "20"

# ---------------------------------------------------------------- planner (Node)

.planner:
  image: node:22
  cache:
    key:
      files:
        - planner/package-lock.json
    paths:
      - planner/.npm/
  before_script:
    - cd planner
    - npm ci --cache .npm --prefer-offline

planner-check:
  extends: .planner
  stage: test
  script:
    - npm run check
    - npm run build

# GitLab Pages serves the folder "public".
pages:
  extends: .planner
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run build
    - cd ..
    - rm -rf public
    - cp -r planner/packages/web/dist public
  artifacts:
    paths:
      - public

# ---------------------------------------------------------------- rover simulation (Python, ROS 2)
# The fast jobs need no ROS. The launch check uses the official ROS image.

.rover-python:
  image: python:3.12-slim
  cache:
    key: pip-$CI_JOB_NAME
    paths: [.cache/pip]
  before_script:
    - cd rover-slam

rover-lint:
  extends: .rover-python
  stage: lint
  script:
    - pip install ruff==0.17.5
    - ruff check .
    - bash -n run_demo.sh tools/tile_windows.sh

rover-unit-tests:
  extends: .rover-python
  stage: test
  script:
    - pip install "numpy==1.26.4" "scipy==1.11.4" "pillow==10.2.0" pytest
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: rover-slam/report.xml

# The 63 MB meshes are not in git: prove that they rebuild byte-identical from the stored assets.
rover-mesh-rebuild:
  extends: .rover-python
  stage: test
  script:
    - pip install "numpy==1.26.4" "scipy==1.11.4" "pillow==10.2.0"
    - python tools/make_world.py --from-assets
    - md5sum -c config/meshes.md5

# All launch files load and declare their arguments (catches import, syntax and path errors).
rover-launch-files:
  image: ros:jazzy-ros-base
  stage: test
  script:
    - cd rover-slam
    - source /opt/ros/jazzy/setup.bash
    - for f in core viewers demo; do ros2 launch --show-args launch/$f.launch.py > /dev/null || exit 1; done
