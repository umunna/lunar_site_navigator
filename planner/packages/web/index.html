<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="LSN, the Lunar Site Navigator: see when a landing site on the Moon has the Sun and the Earth in view. Data from NASA JPL Horizons and NASA LOLA." />
    <title>Lunar Site Navigator</title>
    <!-- The loading screen. Its styles are here, not in the app's style file, so that it shows before any script or style file arrives. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #0a0a0a; color: #f3f5f8;
        font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        transition: opacity 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      .splash-box { transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1), filter 900ms ease-out; }
      .splash-out .splash-box { transform: scale(1.08); filter: blur(6px); }
      /* The page comes into focus and settles while the loading screen fades. */
      @keyframes page-enter { from { opacity: 0; transform: scale(0.97); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
      #root.page-enter { animation: page-enter 900ms cubic-bezier(0.22, 1, 0.36, 1) both; transform-origin: 50% 30vh; }
      .splash-box { display: grid; gap: 18px; width: min(260px, 70vw); }
      .splash-name { margin: 0; text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 0.5em; line-height: 1; padding-left: 0.5em; color: #ffffff; }
      .splash-track { width: 100%; height: 3px; border-radius: 2px; background: #23272e; overflow: hidden; }
      .splash-fill { width: 100%; height: 100%; background: #f2a93b; transform: scaleX(0); transform-origin: left center; }
      .splash-percent { margin: -8px 0 0; text-align: right; font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 0.05em; color: #8b949e; font-variant-numeric: tabular-nums; }
      @media (prefers-reduced-motion: reduce) { #splash, .splash-box { transition: none; } #root.page-enter { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Lunar Site Navigator is loading">
      <div class="splash-box">
        <p class="splash-name">LSN</p>
        <div class="splash-track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="splash-fill"></div>
        </div>
        <p class="splash-percent">0%</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
